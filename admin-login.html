<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="author" content="حمادي ستور"><meta name="creator" content="حمادي ستور"><meta name="contact" content="0946678902"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | الميري ستور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#3b005e,transparent 35%),#08030d;color:#fff;font-family:Cairo}.card{width:min(420px,calc(100% - 28px));background:#12081a;border:1px solid #3a1a4b;border-radius:25px;padding:28px;box-shadow:0 25px 80px #6d00a633}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#d34cff,#7000ff);font-size:27px;margin-bottom:15px}.muted{color:#a99daf;font-size:12px}.field{display:grid;gap:6px;margin-top:14px}.field input{padding:12px;border-radius:12px;background:#0b0410;border:1px solid #321a40;color:#fff;outline:0}.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,#b400ff,#7200ff)}#msg{margin-top:12px;color:#ff8da1;font-size:12px}</style></head>
<body><div class="card"><div class="logo">♢</div><h1>تسجيل الدخول</h1><p class="muted">الميري ستور — للمشرفين وللأعضاء</p>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="login">تسجيل الدخول</button><div id="msg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://bbhtaxvnodilhuaampcs.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaHRheHZub2RpbGh1YWFtcGNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTg3MjUsImV4cCI6MjEwNDQ3NDcyNX0.vUgFQ6MzPKh2nivu1FL8yfUC4JFB20g_06ak554zSmg");
login.onclick=async()=>{
  msg.textContent='جاري التحقق...';
  const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
  if(error){msg.textContent=error.message;return}

  // تحقق: هل هذا الحساب مشرف؟
  const {data:admin}=await sb.from('admin_users').select('active').eq('user_id',data.user.id).eq('active',true).maybeSingle();

  if(admin){
    // مشرف → لوحة الإدارة
    location.href='admin.html';
  }else{
    // مستخدم عادي → الموقع الرئيسي
    location.href='hamadi-store.html';
  }
};
</script></body></html>
